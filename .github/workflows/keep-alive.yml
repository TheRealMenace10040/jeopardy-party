# Free Supabase projects pause after a week without activity.
# A tiny weekly request keeps the game ready for party night.
name: Keep Supabase awake
on:
  schedule:
    - cron: '0 15 * * 1,4'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the database
        # The publishable key is public by design (it ships in the web app).
        run: |
          curl --fail -s -X POST \
            -H "apikey: sb_publishable_n7IEg45t3qD7-Mp4wDTz6A_wvWUxnx0" \
            -H "Content-Type: application/json" \
            https://niizscsrpuxtmtynfmvz.supabase.co/rest/v1/rpc/server_now -d '{}'
